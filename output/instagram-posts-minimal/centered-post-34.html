<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Centered Ad 34</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      font-family: 'Rubik', sans-serif;
      direction: rtl;
      unicode-bidi: plaintext;
      position: relative;
      display: grid;
      place-items: center;
    }
    .poster {
      width: 920px;
      min-height: 980px;
      border-radius: 42px;
      padding: 42px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 34px 80px #00000030;
      border: 2px solid #ffffff33;
      position: relative;
      overflow: hidden;
    }
    .angle {
      justify-self: start;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(2px);
      width: fit-content;
      max-width: 100%;
    }
    .hook {
      margin: 0;
      font-size: 72px;
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -1px;
      text-wrap: balance;
    }
    .subhook {
      margin: 0;
      font-size: 31px;
      line-height: 1.3;
      font-weight: 500;
      text-wrap: balance;
    }
    .msg, .reply {
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 29px;
      line-height: 1.28;
      font-weight: 600;
      text-wrap: pretty;
    }
    .cta {
      margin-top: 8px;
      border-radius: 18px;
      padding: 16px 20px;
      text-align: center;
      font-size: 35px;
      font-weight: 900;
      line-height: 1.15;
      text-wrap: balance;
    }

    
    body {
      background:
        radial-gradient(circle at 10% 12%, #ffd7708f 0%, transparent 34%),
        radial-gradient(circle at 92% 88%, #ff65252b 0%, transparent 36%),
        linear-gradient(155deg, #fff7e8 0%, #ffeac8 100%);
      color: #1a130f;
    }
    .poster {
      background: linear-gradient(180deg, #fffefb 0%, #fff2dd 100%);
      border-color: #f1ddc4;
    }
    .angle { background: #17120f; color: #fff; }
    .hook { color: #1a130f; }
    .subhook { color: #463326; }
    .msg { background: #efefef; color: #23180f; border: 1px solid #dedede; }
    .reply { background: #ffe6cb; color: #23180f; border: 2px solid #ffbc84; }
    .cta { background: linear-gradient(180deg,#ff5d17 0%,#ff4d00 100%); color: #fff; }
  
  </style>
</head>
<body>
  <article class="poster">
    <div class="angle">מסרים מעורבים שמבלבלים שוב</div>
    <h1 class="hook">חם, קר, ואז עוד הודעה</h1>
    <p class="subhook">כשהוא לא ברור, התשובה שלך צריכה להיות כן</p>
    <div class="msg">מתגעגע אבל לא יודע מה אני רוצה.</div>
    <div class="reply">אני לא נכנסת למשהו לא ברור. כשתדע מה אתה רוצה, דבר.</div>
    <div class="cta">לענות בלי להתבלבל</div>
  </article></body>
</html>
