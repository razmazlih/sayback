<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Centered Ad 33</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      font-family: 'Rubik', sans-serif;
      direction: rtl;
      unicode-bidi: plaintext;
      position: relative;
      display: grid;
      place-items: center;
    }
    .poster {
      width: 920px;
      min-height: 980px;
      border-radius: 42px;
      padding: 42px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 34px 80px #00000030;
      border: 2px solid #ffffff33;
      position: relative;
      overflow: hidden;
    }
    .angle {
      justify-self: start;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(2px);
      width: fit-content;
      max-width: 100%;
    }
    .hook {
      margin: 0;
      font-size: 72px;
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -1px;
      text-wrap: balance;
    }
    .subhook {
      margin: 0;
      font-size: 31px;
      line-height: 1.3;
      font-weight: 500;
      text-wrap: balance;
    }
    .msg, .reply {
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 29px;
      line-height: 1.28;
      font-weight: 600;
      text-wrap: pretty;
    }
    .cta {
      margin-top: 8px;
      border-radius: 18px;
      padding: 16px 20px;
      text-align: center;
      font-size: 35px;
      font-weight: 900;
      line-height: 1.15;
      text-wrap: balance;
    }

    
    body {
      background:
        radial-gradient(circle at 90% 12%, #ffe06c8e 0%, transparent 34%),
        radial-gradient(circle at 8% 88%, #ff6d2d30 0%, transparent 34%),
        linear-gradient(170deg, #fff8eb 0%, #ffe8c6 100%);
      color: #1b140f;
    }
    .poster {
      background: linear-gradient(180deg, #ffffffd9 0%, #fff6ead6 100%);
      border-color: #ffffff80;
      backdrop-filter: blur(10px);
    }
    .angle { background: #ff4d00; color: #fff; }
    .hook { color: #1a130f; }
    .subhook { color: #3f2d22; }
    .msg { background: #f1f1f1; color: #23180f; border: 1px solid #dfdfdf; }
    .reply { background: #ffe8cf; color: #23180f; border: 2px solid #ffbe88; }
    .cta { background: #17120f; color: #fff; }
  
  </style>
</head>
<body>
  <article class="poster">
    <div class="angle">הודעה לילית שפותחת הכול מחדש</div>
    <h1 class="hook">הודעה בלילה שלא נותנת לישון</h1>
    <p class="subhook">לא כל געגוע של 1 בלילה צריך לקבל גישה ללב</p>
    <div class="msg">ערה? חשבתי עלייך עכשיו.</div>
    <div class="reply">ראיתי. אם יש משהו אמיתי להגיד, נדבר מחר בצורה ברורה.</div>
    <div class="cta">לשמור על הלב והשינה</div>
  </article></body>
</html>
