<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Centered Ad 35</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      font-family: 'Rubik', sans-serif;
      direction: rtl;
      unicode-bidi: plaintext;
      position: relative;
      display: grid;
      place-items: center;
    }
    .poster {
      width: 920px;
      min-height: 980px;
      border-radius: 42px;
      padding: 42px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 34px 80px #00000030;
      border: 2px solid #ffffff33;
      position: relative;
      overflow: hidden;
    }
    .angle {
      justify-self: start;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(2px);
      width: fit-content;
      max-width: 100%;
    }
    .hook {
      margin: 0;
      font-size: 72px;
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -1px;
      text-wrap: balance;
    }
    .subhook {
      margin: 0;
      font-size: 31px;
      line-height: 1.3;
      font-weight: 500;
      text-wrap: balance;
    }
    .msg, .reply {
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 29px;
      line-height: 1.28;
      font-weight: 600;
      text-wrap: pretty;
    }
    .cta {
      margin-top: 8px;
      border-radius: 18px;
      padding: 16px 20px;
      text-align: center;
      font-size: 35px;
      font-weight: 900;
      line-height: 1.15;
      text-wrap: balance;
    }

    
    body {
      background:
        radial-gradient(circle at 12% 8%, #ffd2004d 0%, transparent 33%),
        radial-gradient(circle at 90% 78%, #ff4d0030 0%, transparent 36%),
        linear-gradient(165deg, #17110e 0%, #2a170f 100%);
      color: #fff5ea;
    }
    .poster {
      background: linear-gradient(180deg, #21150f 0%, #2d1a0f 100%);
      border-color: #ffffff2a;
    }
    .angle { background: #ffd400; color: #21140c; }
    .hook { color: #fff2e5; }
    .subhook { color: #ffd8be; }
    .msg { background: #ffffffeb; color: #22160f; border: 1px solid #ffffff; }
    .reply { background: #fff7ee; color: #22160f; border: 2px solid #ffc699; }
    .cta { background: #fff; color: #22160f; }
  
  </style>
</head>
<body>
  <article class="poster">
    <div class="angle">הצבת גבול מול אקס שבודק גבולות</div>
    <h1 class="hook">כשצריך סוף סוף לשים גבול</h1>
    <p class="subhook">אפשר להיות ברורה בלי להיות קרה או מתנצלת</p>
    <div class="msg">למה את ככה? רק רציתי לדבר.</div>
    <div class="reply">אני שומרת על מה שנכון לי עכשיו, ולכן לא ממשיכה את השיחה הזאת.</div>
    <div class="cta">לנסח גבול מדויק</div>
  </article></body>
</html>
