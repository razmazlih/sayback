<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <title>SayBack Pro E Slide 1</title>
  </head>
  <body>
    <main class="slide">
      <div class="halo left"></div>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">SayBack</span>
        </div>
        <div class="microcopy">צילום מובייל אמיתי</div>
      </header>

      <section class="layout-two-col">
        <div class="copy-col">
          <div class="eyebrow">לא נתקעים על ניסוח</div>
          <h1 class="title-lg">הודעה אחת.<br /><span class="accent">3 תשובות</span><br />מוכנות.</h1>
          <p class="lead">מעלים הודעה ומקבלים תשובות שאפשר לשלוח מיד.</p>
          <div class="simple-list">
            <div class="simple-item">מבינים בשנייה מה SayBack עושה, עם מסך מובייל אמיתי ולא חתוך.</div>
          </div>
        </div>

        <div>
          <div class="phone-frame">
            <div class="phone-screen">
              <img src="../refs/mobile/mobile-hero.png" alt="מסך מובייל של SayBack" />
            </div>
          </div>
          <div class="center-note">כך המוצר נראה באמת בטלפון של המשתמש.</div>
        </div>
      </section>
    </main>
  </body>
</html>
