<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <title>SayBack Pro E Slide 2</title>
  </head>
  <body>
    <main class="slide">
      <div class="halo right"></div>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">SayBack</span>
        </div>
        <div class="microcopy">פשוט להבין</div>
      </header>

      <section class="layout-two-col">
        <div class="copy-col">
          <div class="eyebrow">איך זה עובד</div>
          <h1 class="title">מדביקים.<br />בוחרים טון.<br />שולחים.</h1>
          <p class="lead">שלושה צעדים וזהו.</p>
          <div class="step-stack">
            <article class="glass strong step-card">
              <strong>מדביקים הודעה או צילום מסך</strong>
              <p>כמו שזה, בלי להתחיל הכול מחדש.</p>
            </article>
            <article class="glass step-card">
              <strong>בוחרים טון</strong>
              <p>עדין, ישיר או זורם.</p>
            </article>
            <article class="glass step-card">
              <strong>מקבלים בדיוק 3 תשובות</strong>
              <p>ובוחרים אחת לשליחה.</p>
            </article>
          </div>
        </div>

        <div>
          <div class="phone-frame">
            <div class="phone-screen">
              <img src="../refs/mobile/mobile-flow.png" alt="זרימת העבודה של SayBack במובייל" />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
