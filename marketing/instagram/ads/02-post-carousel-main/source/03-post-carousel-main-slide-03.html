<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <title>SayBack Pro E Slide 3</title>
  </head>
  <body>
    <main class="slide">
      <div class="halo left"></div>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">SayBack</span>
        </div>
        <div class="microcopy">לא רק לקראש</div>
      </header>

      <div class="eyebrow">אותו מוצר, כמה מצבים</div>
      <h1 class="title compact">לקראש, ללקוח,<br />לבוס או ליד2.</h1>
      <p class="lead">אותו מוצר. טון נכון לכל שיחה.</p>

      <section class="context-wrap" style="margin-top: 26px;">
        <div class="context-row" style="margin-top: 0; margin-bottom: 22px;">
          <span class="context-pill primary">קראש</span>
          <span class="context-pill">לקוח</span>
          <span class="context-pill">בוס</span>
          <span class="context-pill">יד2</span>
        </div>
        <div class="phone-frame small" style="width: 340px;">
          <div class="phone-screen">
            <img src="../refs/mobile/mobile-examples.png" alt="דוגמאות שימוש של SayBack במובייל" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
