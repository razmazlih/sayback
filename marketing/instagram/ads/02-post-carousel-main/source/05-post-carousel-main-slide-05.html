<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <title>SayBack Pro E Slide 5</title>
  </head>
  <body>
    <main class="slide">
      <div class="halo left"></div>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">SayBack</span>
        </div>
        <div class="microcopy">פשוט להתחיל</div>
      </header>

      <section class="pricing-grid">
        <div>
          <div class="phone-frame small">
            <div class="phone-screen">
              <img src="../refs/mobile/mobile-pricing.png" alt="מסך התמחור של SayBack במובייל" />
            </div>
          </div>
        </div>

        <div class="copy-col">
          <div class="eyebrow">בלי לסבך את זה</div>
          <h1 class="title compact">3 שימושים ראשונים<br /><span class="accent">בחינם</span>. ואז מסלול.</h1>
          <p class="lead">פותחים SayBack, מדביקים הודעה, ושולחים.</p>
          <div class="offer-stack">
            <article class="glass strong offer-card featured">
              <strong>להתחלה מהירה</strong>
              <span class="plan">50 שימושים</span>
              <span class="price">9.90₪</span>
              <p>חד־פעמי, בלי התחייבות.</p>
            </article>
            <article class="glass offer-card">
              <strong>לשימוש קבוע</strong>
              <span class="plan">ללא הגבלה חודשי</span>
              <span class="price">24.90₪</span>
              <p>למי שמשתמש הרבה.</p>
            </article>
            <article class="glass strong cta-wrap">
              <strong>להדביק הודעה. לקבל תשובה. לשלוח.</strong>
              <p>ברור גם ממבט קצר.</p>
              <div class="cta-button">נסו עכשיו · לינק בביו</div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
