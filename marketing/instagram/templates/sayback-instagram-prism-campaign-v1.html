<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SayBack Instagram Prism Campaign V1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700;800&family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-900: #0c0e12;
        --paper-100: #f6f2e9;
        --gold-500: #c6a56a;
        --teal-700: #123a44;
        --sand-200: #e3d8c7;
        --line-alpha: rgba(198, 165, 106, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Heebo', sans-serif;
        background:
          radial-gradient(circle at 14% 8%, rgba(227, 216, 199, 0.52) 0%, transparent 34%),
          radial-gradient(circle at 88% 1%, rgba(198, 165, 106, 0.3) 0%, transparent 26%),
          linear-gradient(180deg, #f2ece1 0%, #ece2d2 100%);
        color: var(--ink-900);
      }

      .campaign-grid {
        width: max-content;
        margin: 24px;
        display: grid;
        grid-template-columns: repeat(3, 1080px);
        grid-auto-rows: min-content;
        gap: 92px;
      }

      .creative {
        width: 1080px;
        position: relative;
        overflow: hidden;
        border-radius: 44px;
        border: 2px solid rgba(12, 14, 18, 0.18);
        box-shadow:
          0 20px 60px rgba(12, 14, 18, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.24);
        isolation: isolate;
      }

      .creative::before,
      .creative::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: -1;
      }

      .creative::before {
        background:
          linear-gradient(136deg, transparent 0%, rgba(198, 165, 106, 0.1) 41%, transparent 74%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 100%);
      }

      .creative::after {
        background-image:
          linear-gradient(90deg, transparent 0, transparent calc(100% - 1px), var(--line-alpha) calc(100% - 1px), var(--line-alpha) 100%),
          linear-gradient(180deg, transparent 0, transparent calc(100% - 1px), var(--line-alpha) calc(100% - 1px), var(--line-alpha) 100%);
        background-size: 120px 120px;
        opacity: 0.42;
      }

      .post {
        height: 1350px;
        padding: 72px;
        display: grid;
        grid-template-rows: auto auto auto 1fr auto;
        gap: 24px;
      }

      .story {
        height: 1920px;
        padding: 220px 72px 260px;
        display: grid;
        grid-template-rows: auto auto auto auto auto;
        gap: 24px;
      }

      .theme-dark {
        color: var(--paper-100);
        background: linear-gradient(162deg, #0c0e12 0%, #142028 58%, #123a44 100%);
        border-color: rgba(227, 216, 199, 0.28);
      }

      .theme-dark::after {
        opacity: 0.2;
      }

      .theme-light {
        color: var(--ink-900);
        background: linear-gradient(160deg, #f6f2e9 0%, #ece0cc 54%, #e3d8c7 100%);
      }

      .theme-ink {
        color: var(--paper-100);
        background: linear-gradient(140deg, #1a1f28 0%, #232a33 45%, #2f2930 100%);
        border-color: rgba(198, 165, 106, 0.35);
      }

      .theme-teal {
        color: #f6f2e9;
        background: linear-gradient(160deg, #123a44 0%, #1f4e58 55%, #2b5f6a 100%);
      }

      .theme-paper {
        color: #13212a;
        background: linear-gradient(145deg, #f9f5ec 0%, #f4ecdf 44%, #ece0ce 100%);
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .badge {
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.01em;
        background: rgba(255, 255, 255, 0.08);
      }

      .serial {
        font-family: 'Secular One', sans-serif;
        font-size: 30px;
        line-height: 1;
        opacity: 0.9;
      }

      .title-wrap {
        display: grid;
        gap: 12px;
      }

      .hook {
        margin: 0;
        font-family: 'Frank Ruhl Libre', serif;
        font-size: 72px;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }

      .subhook {
        margin: 0;
        font-size: 34px;
        line-height: 1.28;
        font-weight: 500;
      }

      .card {
        border: 1px solid rgba(198, 165, 106, 0.65);
        background: rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 20px 22px;
      }

      .theme-light .card,
      .theme-paper .card {
        background: rgba(255, 255, 255, 0.56);
      }

      .label {
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.01em;
        margin-bottom: 10px;
        opacity: 0.92;
      }

      .scenario {
        margin: 0;
        font-size: 31px;
        line-height: 1.26;
        font-weight: 600;
      }

      .incoming {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(198, 165, 106, 0.5);
        font-size: 30px;
        line-height: 1.3;
        font-weight: 500;
      }

      .replies {
        display: grid;
        gap: 14px;
        align-content: start;
      }

      .reply {
        border-radius: 20px;
        border: 1px solid rgba(198, 165, 106, 0.68);
        background: rgba(255, 255, 255, 0.1);
        padding: 16px 18px;
        font-size: 28px;
        line-height: 1.3;
        font-weight: 500;
      }

      .theme-light .reply,
      .theme-paper .reply {
        background: rgba(255, 255, 255, 0.68);
      }

      .cta {
        border-radius: 999px;
        border: 1px solid currentColor;
        padding: 20px 28px;
        font-size: 31px;
        line-height: 1.2;
        font-weight: 800;
        text-align: center;
        background: rgba(255, 255, 255, 0.12);
      }

      .theme-light .cta,
      .theme-paper .cta {
        background: rgba(19, 33, 42, 0.08);
      }

      .story .hook {
        font-size: 84px;
      }

      .story .subhook {
        font-size: 40px;
      }

      .story .proof {
        border-radius: 24px;
        border: 1px solid rgba(198, 165, 106, 0.62);
        background: rgba(255, 255, 255, 0.1);
        padding: 18px 20px;
        font-size: 31px;
        line-height: 1.28;
        font-weight: 600;
      }

      .theme-light .proof,
      .theme-paper .proof {
        background: rgba(255, 255, 255, 0.68);
      }

      [data-text] {
        overflow-wrap: break-word;
      }

      .hook,
      .subhook,
      .scenario,
      .incoming,
      .reply,
      .proof,
      .cta {
        text-wrap: balance;
      }
    </style>
  </head>

      postData.forEach((post, idx) => {

            <div class="reply" data-text>תשובה 3: ${post.replies[2]}</div>
          </section>

          <section class="cta" data-block="cta" data-text>${post.cta}</section>
        `;

        grid.appendChild(article);
      });

      storyData.forEach((story, idx) => {
        const article = document.createElement('article');
        article.className = `creative story ${pickTheme(idx + postData.length)}`;
        article.dataset.kind = 'story';
        article.dataset.slug = story.slug;

        article.innerHTML = `
          <section class="topline" data-block="topline">
            <div class="badge" data-text>${story.audience}</div>
            <div class="serial">סטורי ${story.id}/5</div>
          </section>

          <section class="title-wrap" data-block="title-wrap">
            <h1 class="hook" data-text>${story.hook}</h1>
            <p class="subhook" data-text>${story.body}</p>
          </section>

          <section class="card" data-block="scenario-card">
            <div class="label">סיטואציה</div>
            <p class="scenario" data-text>${story.scenario}</p>
          </section>

          <section class="proof" data-block="proof" data-text>${story.proof}</section>

          <section class="cta" data-block="cta" data-text>${story.cta}</section>
        `;

        grid.appendChild(article);
      });
    </script>
  </body>
</html>
